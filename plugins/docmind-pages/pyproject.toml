[project]
name = "docmind-pages"
version = "0.1.0"
description = "把 Apple Pages 文档导入 DocMind"
requires-python = ">=3.12"
# 与 docmind-tex 同一条约束：DocMind 打包后的 runtime 里没有安装器。这里的
# 「依赖」是操作系统级的（macOS + Pages.app），由 availability 声明，不是 pip 包。
dependencies = []

[project.entry-points."docmind.plugins"]
docmind-pages = "docmind_pages:plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docmind_pages"]
