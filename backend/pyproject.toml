[project]
name = "docmind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "markdownify>=1.2,<2",
  # numpy 被 app/core/onnx_embedding.py 延迟 import。目前靠 onnxruntime 硬依赖它
  # 侥幸存在于 runtime，但那是运气不是契约：一旦上游依赖树变动就会同样炸在
  # 「加载模型」时。与 transformers 一并显式声明。
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "playwright>=1.55,<2",
  "rank-bm25>=0.2.2,<1",
  # 语雀网页登录的浏览器驱动。刻意不用 Playwright：它硬依赖 node driver
  #（实测 driver/node 115M），且自带 170M Chromium。WebDriver 驱动用户
  # 已装的 Chrome，驱动本体仅 9.3M，且 Chromium 从不进安装包。
  "selenium>=4.20,<5",
  # 向量索引：sqlite-vec 替代 chromadb。零传递依赖（只需一个 wheel），
  # 沙箱/离线环境友好；对比 chromadb 少 134M（rust_bindings 50M + kubernetes 44M
  # + grpc 40M + chromadb 3.3M + bcrypt/opentelemetry）。实测 5 万条 top-3 = 29ms。
  "sqlite-vec>=0.1.6,<1",
  "sqlalchemy>=2.0.40,<3",
  # 只为 AutoTokenizer（bge-m3 分词）而装：app/core/onnx_embedding.py 直接
  # `from transformers import AutoTokenizer`。必须显式声明，不能靠 fp32 extra 里
  # sentence-transformers 带进来 —— 打包脚本 build-backend-runtime.sh 只解析
  # 本项目的 dependencies 段，optional-dependencies 会被跳过，于是安装版
  # 内置模型点击加载必然 ModuleNotFoundError: transformers。
  # 纯 tokenizer 路径不碰 torch（torch 只在 fp32 extra 里）。
  # ⚠️ 本段注释里禁止出现方括号。打包脚本用非贪婪正则截取依赖列表，
  # 注释里任何右方括号都会让它提前截断、静默漏掉后面的依赖（踩过一次）。
  "transformers>=5,<6",
  "uvicorn>=0.35,<1",
]

# fp32 回退路径的可选依赖：仅当本机既没有内置 ONNX 模型、也没在用户目录准备过
# model.onnx 时才会走到SentenceTransformer（app/core/embedding.py::_build_model）。
# 它会拖入 torch（约 500MB），而打包态必然内置 int8 ONNX 模型，所以默认不安装；
# 需要开发态调试 fp32 路径时用 `uv sync --extra fp32` 临时装上。
[project.optional-dependencies]
fp32 = ["sentence-transformers>=5.1,<6"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient',
  'ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning',
  'ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning',
  'ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py311"
